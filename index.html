<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha Carteira</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="header card">
    <div>
      <h1>Minha Carteira</h1>
      <small>Patrimônio</small>
      <div id="patrimonio" class="valor">R$ 0,00</div>
    </div>
    <button onclick="atualizar()">Atualizar</button>
  </div>

  <div class="card">
    <input id="ativo" placeholder="IVVB11">
    <input id="qtd" type="number" placeholder="Quantidade">
    <input id="compra" type="number" step="0.01" placeholder="Preço de compra">
    <input id="data" type="date">
    <button onclick="salvar()">Salvar</button>
  </div>

  <button id="toggleLista" onclick="
const l=document.getElementById('lista');
const b=document.getElementById('toggleLista');
if(l.style.display==='none'){l.style.display='block';b.textContent='Ocultar ativos';}
else{l.style.display='none';b.textContent='Mostrar ativos';}
">Mostrar ativos</button>

<div id="lista" style="display:none"></div>
</div>
<script src="app.js"></script>
</body>
</html>
