<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Carteira</title>
<style>
body{font-family:Arial;max-width:900px;margin:auto;padding:20px;background:#f4f4f4}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
input,button{padding:8px;margin:5px}
</style>
</head>
<body>

<h2>Minha Carteira</h2>

<input id="ativo" placeholder="IVVB11">
<input id="qtd" type="number" placeholder="Qtd">
<input id="compra" type="number" step="0.01" placeholder="Preço de compra">

<button onclick="adicionar()">Adicionar</button>
<button onclick="atualizarTudo()">Atualizar</button>

<table>
<thead>
<tr>
<th>Ativo</th>
<th>Qtd</th>
<th>Compra</th>
<th>Preço Atual</th>
<th>Lucro/Prejuízo</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

<h3 id="total">Patrimônio: R$ 0,00</h3>

<script>
let carteira=[];

function adicionar(){
 carteira.push({
   ativo:document.getElementById("ativo").value.toUpperCase(),
   qtd:Number(document.getElementById("qtd").value),
   compra:Number(document.getElementById("compra").value)
 });
 atualizarTudo();
}

async function buscarPreco(ativo){
 try{
   const url="https://corsproxy.io/?https://query1.finance.yahoo.com/v8/finance/chart/"+ativo+".SA";
   const r=await fetch(url);
   const j=await r.json();
   return j.chart.result[0].meta.regularMarketPrice;
 }catch(e){
   return null;
 }
}

async function atualizarTudo(){
 let html="";
 let patrimonio=0;

 for(const item of carteira){
   const preco=await buscarPreco(item.ativo);

   if(preco===null){
      html+=`<tr>
      <td>${item.ativo}</td>
      <td>${item.qtd}</td>
      <td>R$ ${item.compra.toFixed(2)}</td>
      <td>Erro</td>
      <td>-</td>
      </tr>`;
      continue;
   }

   const lucro=(preco-item.compra)*item.qtd;
   patrimonio+=preco*item.qtd;

   html+=`<tr>
   <td>${item.ativo}</td>
   <td>${item.qtd}</td>
   <td>R$ ${item.compra.toFixed(2)}</td>
   <td>R$ ${preco.toFixed(2)}</td>
   <td style="color:${lucro>=0?'green':'red'}">
   R$ ${lucro.toFixed(2)}
   </td>
   </tr>`;
 }

 document.getElementById("tabela").innerHTML=html;
 document.getElementById("total").textContent="Patrimônio: R$ "+patrimonio.toFixed(2);
}
</script>

</body>
</html>
