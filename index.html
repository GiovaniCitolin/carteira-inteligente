<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha Carteira</title>
<style>
body{font-family:Arial;max-width:980px;margin:auto;padding:20px;background:#f4f4f4}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
input,button{padding:8px;margin:4px}
button{cursor:pointer}
</style>
</head>
<body>
<h2>Minha Carteira</h2>

<input id="ativo" placeholder="IVVB11">
<input id="qtd" type="number" placeholder="Qtd">
<input id="compra" type="number" step="0.01" placeholder="Preço de compra">
<input id="dataCompra" type="date">
<button onclick="salvar()">Salvar</button>
<button onclick="atualizarTudo()">Atualizar</button>

<table>
<thead>
<tr>
<th>Ativo</th><th>Qtd</th><th>Preço Compra</th><th>Data Compra</th>
<th>Preço Atual</th><th>Lucro/Prejuízo</th><th>Ações</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

<h3 id="total">Patrimônio: R$ 0,00</h3>

<script>
let carteira=[];
let editando=-1;

async function buscarPreco(ativo){
 try{
   const url="https://corsproxy.io/?https://query1.finance.yahoo.com/v8/finance/chart/"+ativo+".SA";
   const r=await fetch(url);
   const j=await r.json();
   return j.chart.result[0].meta.regularMarketPrice;
 }catch(e){return null;}
}

function limpar(){
 ativo.value="";
 qtd.value="";
 compra.value="";
 dataCompra.value="";
 editando=-1;
}

function salvar(){
 const item={
   ativo:ativo.value.toUpperCase(),
   qtd:Number(qtd.value),
   compra:Number(compra.value),
   data:dataCompra.value
 };
 if(editando==-1) carteira.push(item);
 else carteira[editando]=item;
 limpar();
 atualizarTudo();
}

function editar(i){
 const c=carteira[i];
 ativo.value=c.ativo;
 qtd.value=c.qtd;
 compra.value=c.compra;
 dataCompra.value=c.data;
 editando=i;
}

function excluir(i){
 if(confirm("Excluir este ativo?")){
   carteira.splice(i,1);
   atualizarTudo();
 }
}

async function atualizarTudo(){
 let html="",pat=0;
 for(let i=0;i<carteira.length;i++){
   const it=carteira[i];
   const preco=await buscarPreco(it.ativo);
   const lucro=preco===null?0:(preco-it.compra)*it.qtd;
   if(preco!==null) pat+=preco*it.qtd;
   html+=`<tr>
   <td>${it.ativo}</td>
   <td>${it.qtd}</td>
   <td>R$ ${it.compra.toFixed(2)}</td>
   <td>${it.data||"-"}</td>
   <td>${preco===null?"Erro":"R$ "+preco.toFixed(2)}</td>
   <td style="color:${lucro>=0?"green":"red"}">${preco===null?"-":"R$ "+lucro.toFixed(2)}</td>
   <td>
     <button onclick="editar(${i})">Editar</button>
     <button onclick="excluir(${i})">Excluir</button>
   </td>
   </tr>`;
 }
 tabela.innerHTML=html;
 total.textContent="Patrimônio: R$ "+pat.toFixed(2);
}
</script>
</body>
</html>
